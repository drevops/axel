name: Release Node.js

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions: {}

jobs:
  release-nodejs:
    name: Release Node.js
    runs-on: ubuntu-latest

    permissions:
      actions: read # Wait for Release Drafter to finish.
      contents: write # Upload the assets and publish the release.
      id-token: write # Sign the provenance and publish to npm.
      attestations: write # Store the provenance attestation.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a version."
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"
          if [ "${version}" != "${TAG}" ]; then
            echo "::error::Tag '${TAG}' doesn't match version '${version}' in package.json. Release with 'npm version'."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # A dependency's install script must not run next to a write token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Written outside 'dist', which npm packs as it is.
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.js > "${RUNNER_TEMP}/checksums.txt"

      - name: Generate Subresource Integrity hashes
        working-directory: dist
        shell: bash
        run: |
          {
            echo '## Subresource Integrity'
            echo
            echo '| File | Integrity |'
            echo '| --- | --- |'
            for file in *.js; do
              integrity="sha384-$(openssl dgst -sha384 -binary "${file}" | openssl base64 -A)"
              echo "| \`${file}\` | \`${integrity}\` |"
            done
          } > "${RUNNER_TEMP}/sri.md"
          cat "${RUNNER_TEMP}/sri.md"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.js

      # Authenticates through npm trusted publishing, so no npm token is stored.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="$(node -p "require('./package.json').name")"
          if npm view "${name}@${VERSION}" version > /dev/null 2>&1; then
            echo "${name}@${VERSION} is already on npm."
            exit 0
          fi

          dist_tag='latest'
          if [[ "${VERSION}" == *-* ]]; then
            dist_tag='next'
          fi

          npm publish --provenance --access public --tag "${dist_tag}" --ignore-scripts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PROVENANCE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${PROVENANCE}" "${RUNNER_TEMP}/axel.intoto.jsonl"

          # The version commit pushed with the tag starts Release Drafter, which
          # sets its draft's tag back to its own guess.
          for run in $(gh run list --workflow draft-release-notes.yml --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'); do
            gh run watch "${run}" > /dev/null || true
          done

          state="$(gh release view "${TAG}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' || echo 'none')"

          if [ "${state}" = 'published' ]; then
            echo "::error::Release '${TAG}' is already published, so its assets can't change."
            exit 1
          fi

          # Release Drafter names its draft after the version it guesses, which
          # can differ from the pushed tag.
          draft=''
          if [ "${state}" = 'none' ]; then
            draft="$(gh release list --json tagName,isDraft --jq '[.[] | select(.isDraft) | .tagName][0] // empty')"
          fi

          if [ -n "${draft}" ]; then
            gh release edit "${draft}" --tag "${TAG}" --title "${TAG}"
          elif [ "${state}" = 'none' ]; then
            gh release create "${TAG}" --title "${TAG}" --generate-notes --draft --verify-tag
          fi

          prerelease='false'
          if [[ "${TAG}" == *-* ]]; then
            prerelease='true'
          fi

          gh release upload "${TAG}" dist/*.js "${RUNNER_TEMP}/checksums.txt" "${RUNNER_TEMP}/axel.intoto.jsonl" --clobber

          notes="$(gh release view "${TAG}" --json body --jq .body)"
          if [ -n "${draft}" ]; then
            notes="${notes//...${draft}/...${TAG}}"
          fi
          printf '%s\n\n' "${notes}" > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/sri.md" >> "${RUNNER_TEMP}/notes.md"

          gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --draft=false --prerelease="${prerelease}" --verify-tag
