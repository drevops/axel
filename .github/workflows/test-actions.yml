name: Test Actions

on:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feature/**'

permissions: {}

jobs:
  test-actions:
    name: Test Actions
    runs-on: ubuntu-latest

    permissions:
      contents: read # Read workflow files for the linters.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check coding standards with yamllint
        run: yamllint --config-file .github/.yamllint-for-gha.yml .github/workflows
        continue-on-error: ${{ vars.CI_ACTIONLINT_IGNORE_FAILURE == '1' }}

      - name: Check coding standards with actionlint
        run: docker run --rm -v "${GITHUB_WORKSPACE:-.}":/app --workdir /app rhysd/actionlint:1.7.4
        continue-on-error: ${{ vars.CI_ACTIONLINT_IGNORE_FAILURE == '1' }}

      - name: Check GitHub Actions security with Zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows
          config: zizmor.yml
          # Report findings in the log; the SARIF upload requires code scanning.
          advanced-security: false
        continue-on-error: ${{ vars.CI_ZIZMOR_IGNORE_FAILURE == '1' }}
