name: Scan code

on:
  schedule:
    - cron: '37 5 * * 1'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  scan-code:
    name: Scan code (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Code scanning needs a public repository or GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}

    permissions:
      actions: read
      contents: read
      security-events: write # Upload the results to code scanning.

    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Scan code for vulnerabilities with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'
