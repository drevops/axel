<!DOCTYPE html>
<!--
  The fields field-complete.test.js changes. Run "npm run build" and open this
  file with "#analytics-debug" appended to the URL to log each event.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Field complete fixture</title>
</head>
<body>
<h1>A field outside any marked form</h1>
<form action="/search">
  <label for="unmarked-field">Keywords</label>
  <input id="unmarked-field" type="text" name="keywords">
</form>

<h1>A marked form</h1>
<form id="apply" action="/apply" data-analytics-form="apply">
  <label for="apply-name">Full <span>name</span> <span aria-hidden="true">*</span></label>
  <input id="apply-name" type="text" name="full_name">

  <label>Phone <input id="apply-phone" type="tel" name="phone"></label>

  <label for="apply-message">Message</label>
  <textarea id="apply-message" name="message">Pre-filled text</textarea>

  <label for="apply-state">State</label>
  <select id="apply-state" name="state">
    <option value="nsw">New South Wales</option>
    <option value="vic">Victoria</option>
  </select>

  <fieldset>
    <legend>Contact method</legend>
    <input id="apply-method-email" type="radio" name="method" value="email">
    <label for="apply-method-email">Email</label>
    <input id="apply-method-phone" type="radio" name="method" value="phone">
    <label for="apply-method-phone">Phone</label>
  </fieldset>

  <input id="apply-terms" type="checkbox" name="terms" value="1">
  <label for="apply-terms">I accept the terms</label>

  <input id="apply-aria" type="text" name="reference" aria-label="Reference number">
  <input id="apply-unnamed" type="text" data-analytics-param-field-label="Custom label">
  <input id="apply-bare" type="text">
  <input id="apply-skipped" type="text" name="internal" data-analytics-skip>
</form>

<script>
  window.analyticsContextLayerSettings = { types: ['field_complete'] };
</script>
<script src="../../build/acl.js"></script>
</body>
</html>
