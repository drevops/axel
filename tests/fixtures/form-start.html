<!DOCTYPE html>
<!--
  The forms form-start.test.js focuses. Run "npm run build" and open this file
  with "#analytics-debug" appended to the URL to log each event.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form start fixture</title>
</head>
<body>
<h1>A form outside any marked form</h1>
<form id="unmarked" action="/search">
  <input id="unmarked-field" type="text" name="keywords">
</form>

<h1>A marked form</h1>
<div data-analytics-param-section="contact">
  <form id="contact" action="/contact" data-analytics-form="contact" data-analytics-param-form-type="enquiry">
    <label for="contact-name">Name</label>
    <input id="contact-name" type="text" name="name">
    <label for="contact-email">Email</label>
    <input id="contact-email" type="email" name="email">
    <input id="contact-skipped" type="text" name="internal" data-analytics-skip>
    <button id="contact-submit" type="submit">Send</button>
  </form>
</div>

<h1>A marked wrapper without an ID or address</h1>
<div data-analytics-form="newsletter">
  <form>
    <input id="newsletter-email" type="email" name="email">
  </form>
</div>

<h1>A form without an address</h1>
<form id="callback" data-analytics-form="callback">
  <input id="callback-phone" type="tel" name="phone">
</form>

<script>
  window.analyticsContextLayerSettings = { types: ['form_start'] };
</script>
<script src="../../build/acl.js"></script>
</body>
</html>
