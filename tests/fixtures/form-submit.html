<!DOCTYPE html>
<!--
  The confirmation markers form-submit.test.js reads. Run "npm run build" and
  open this file with "#analytics-debug" appended to the URL to log each event.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form submit fixture</title>
</head>
<body>
<h1>A confirmation rendered with the page</h1>
<div id="contact-confirmation" data-analytics-form-submitted="contact" data-analytics-param-form-type="enquiry">
  <p>Thank you for your enquiry.</p>
</div>

<h1>A skipped confirmation</h1>
<div data-analytics-skip>
  <div id="skipped-confirmation" data-analytics-form-submitted="internal"></div>
</div>

<h1>A container for confirmations added later</h1>
<div id="ajax-wrapper" data-analytics-param-section="newsletter"></div>

<script>
  window.analyticsContextLayerSettings = { types: ['form_submit'] };

  // Simulates an AJAX form that renders its confirmation after page load.
  setTimeout(() => {
    document.querySelector('#ajax-wrapper').innerHTML = '<p data-analytics-form-submitted="newsletter">Subscribed.</p>';
  }, 2000);
</script>
<script src="../../build/acl.gtm.js"></script>
</body>
</html>
